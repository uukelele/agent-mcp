[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mcp"
version = "0.2.0"
description = "OpenCode-compatible file, search, shell, and web tools exposed over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-mcp contributors" }]
keywords = ["mcp", "opencode", "fastmcp", "filesystem", "shell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=4.1,<5",
  "httpx>=0.27",
  "lxml>=5",
  "ddgs>=9,<10",
  "charset-normalizer>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/uukelele/agent-mcp"
Repository = "https://github.com/uukelele/agent-mcp"
Issues = "https://github.com/uukelele/agent-mcp/issues"

[project.scripts]
agent-mcp = "agent_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
